    <script>
      (function() {
        // Suppress harmless Vite HMR WebSocket connection errors in Cloud Run preview
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : (a && a.stack ? a.stack : ''));
          }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          var fn = e.filename || '';
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || fn.includes('@vite/client') || (e.error && (e.error.stack || '').includes('@vite/client'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : (reason && reason.stack ? reason.stack : ''))) + '';
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
